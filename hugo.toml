baseurl = "https://www.texaslinuxfest.org"
DefaultContentLanguage = "en"
title = "Texas Linux Fest"
enableRobotsTXT = true
theme = "github.com/halogenica/beautifulhugo"
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
#pygmentsUseClassic = true
#pygmentOptions = "linenos=inline"

[pagination]
  pagerSize = 50

# Machine-readable representations of every page.
#
# MARKDOWN publishes the raw markdown source of each page next to its HTML at
# <page>/index.md, so an agent can fetch the text without the page chrome.
# GitHub Pages serves files by path: it cannot negotiate on the Accept header
# or set "Vary: Accept", so the markdown variant is advertised through
# rel="alternate" and /llms.txt rather than through content negotiation.
[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.MARKDOWN]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    isHTML = false
    permalinkable = false
    notAlternative = false
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    isHTML = false
    permalinkable = false
    notAlternative = true
    rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "MARKDOWN", "LLMS"]
  page = ["HTML", "MARKDOWN"]
  section = ["HTML", "RSS", "MARKDOWN"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Trust-anchor pages. Agents check these before recommending an organization.
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1
[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 2
[[menu.main]]
  name = "Privacy"
  url = "/privacy/"
  weight = 3

[Services]
  [Services.Disqus]
    # Shortname = "XXX"
  [Services.googleAnalytics]
    # id = "XXX"

[Params]
  homeTitle = "Texas Linux Fest" # Also used as the <title> and the home page <h1>
#  subtitle = "Texas' Community Tech Conference"
  mainSections = ["event"]
  logo = "/images/txlf-icon-grey.svg"
  favicon = "/images/txlf-icon-grey.svg"
  dateFormat = "January 2, 2006"
  commit = false
  rss = false
  comments = false
  readingTime = false
  wordCount = false
  useHLJS = true
  socialShare = true
  delayDisqus = true
  showRelatedPosts = false
#  cusdisID = "XXX" # Get your App id from cusdis.com
  hideAuthor = true
#  gcse = "012345678901234567890:abcdefghijk" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"
#  disclaimerText = "The opinions expressed herein are my own personal opinions and do not represent my employer’s view in any way."

