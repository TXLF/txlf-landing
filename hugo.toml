# Organization identity, consumed by layouts/partials/seo/structured/organization.html
# and by the generated llms.txt.
[Params.organization]
  name = "Texas Linux Fest"
  legalName = "Texas Linux Fest"
  alternateName = "TXLF"
  description = "Texas Linux Fest is a volunteer-run, non-profit community conference for Linux, open source and free software, held annually in Texas since 2010."
  email = "info@texaslinuxfest.org"
  contactType = "general inquiries"
  foundingDate = "2010"
  logo = "/images/txlf-icon-grey.svg"
  # Texas Linux Fest has no permanent office; the address below is the
  # region the organization operates in. Fill in streetAddress, addressLocality
  # and postalCode if a mailing address becomes available.
  [Params.organization.address]
    streetAddress = ""
    addressLocality = ""
    addressRegion = "TX"
    postalCode = ""
    addressCountry = "US"

# The next Texas Linux Fest, published as schema.org/Event on the home page.
[Params.upcomingEvent]
  name = "Texas Linux Fest 2026"
  url = "https://2026.texaslinuxfest.org/"
  startDate = "2026-11-06"
  endDate = "2026-11-07"
  description = "The 2026 edition of Texas Linux Fest, the annual community conference for Linux and open source in Texas."

[Params.author]
  # Set only your "username" for default hosts and full URLs otherwise (e.g., "https://MyGitLab.org/username")
  name = "Texas Linux Fest"
  email = "info@texaslinuxfest.org"
  facebook = "https://www.facebook.com/TexasLinuxFest/"
  instagram = "https://www.instagram.com/explore/tags/texaslinuxfest/"
  github = "https://github.com/TXLF/"
  twitter = "texaslinuxfest"
  linkedin = "https://www.linkedin.com/company/texas-linux-fest/"
  youtube = "https://www.youtube.com/@texaslinuxfest3002"
  mastodon = "https://fosstodon.org/@TexasLinuxFest/"

[markup]
  [markup.goldmark]
    duplicateResourceFiles = false
    [markup.goldmark.extensions]
      definitionList = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      [markup.goldmark.extensions.cjk]
        eastAsianLineBreaks = false
        eastAsianLineBreaksStyle = 'simple'
        enable = false
        escapedSpace = false
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.delete]
          enable = false
        [markup.goldmark.extensions.extras.insert]
          enable = false
        [markup.goldmark.extensions.extras.mark]
          enable = false
        [markup.goldmark.extensions.extras.subscript]
          enable = false
        [markup.goldmark.extensions.extras.superscript]
          enable = false
      [markup.goldmark.extensions.footnote]
        backlinkHTML = '&#x21a9;&#xfe0e;'
        enable = true
        enableAutoIDPrefix = false
      [markup.goldmark.extensions.passthrough]
        enable = false
        [markup.goldmark.extensions.passthrough.delimiters]
          block = []
          inline = []
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '&ldquo;'
        leftSingleQuote = '&lsquo;'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '&rdquo;'
        rightSingleQuote = '&rsquo;'
    [markup.goldmark.parser]
      autoDefinitionTermID = false
      autoHeadingID = true
      autoIDType = 'github'
      wrapStandAloneImageWithinParagraph = true
      [markup.goldmark.parser.attribute]
        block = false
        title = true
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
